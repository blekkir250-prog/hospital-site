<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виджет расчета стоимости товара</title>
    <link rel="stylesheet" href="Untitled-2.css">
</head>
<body>

    <div class="calc-widget">
        <h2 class="calc-title">Расчет стоимости</h2>
        
        <div class="form-group">
            <label class="form-label" for="product-model">Выберите тип приёма</label>
            <select id="product-model" class="form-select">
                <option value="2000" selected>Базовый — 2 000 ₽</option>
                <option value="4000">Расширенный — 4 000 ₽</option>
                <option value="10000">Премиальный — 10 000 ₽</option>
            </select>
        </div>

        <div class="form-group">
            <span class="form-label">Дополнительные опции</span>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox-input option-checkbox" value="500">
                        <span class="option-text">Выписка препаратов</span>
                    </div>
                    <span class="option-price">+500 ₽</span>
                </label>
                
                <label class="checkbox-label">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox-input option-checkbox" value="2500">
                        <span class="option-text">Недельные приёмы</span>
                    </div>
                    <span class="option-price">+2 500 ₽</span>
                </label>

                <label class="checkbox-label">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox-input option-checkbox" value="5000">
                        <span class="option-text">Годовая консультация</span>
                    </div>
                    <span class="option-price">+5 000 ₽</span>
                </label>
            </div>
        </div>

        <div class="total-container">
            <span class="total-label">Итоговая стоимость:</span>
            <span class="total-price" id="total-price">2 000 ₽</span>
        </div>
    </div>

    <script src="document.js"></script>
</body>
</html>

</head>

</body>
</html>
